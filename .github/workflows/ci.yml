name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, tests, smoke screenshots
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @sw/game exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Sprites match their 3D models
        run: pnpm sprites:check
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: apps/game/test-results/
          if-no-files-found: ignore

  mac:
    name: macOS app (Apple Silicon and Intel)
    needs: check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      # One universal app, so friends with an Intel Mac can play too.
      - run: pnpm desktop:build --ci --target universal-apple-darwin
      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: Shardfall-macOS
          path: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    name: Release for friends
    # Every version in apps/desktop/package.json that reaches main becomes a release with the .dmg and the
    # installation guide; pushes that keep the version change nothing.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: mac
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        run: echo "tag=v$(jq -r .version apps/desktop/package.json)" >> "$GITHUB_OUTPUT"
      - name: Already released?
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" > /dev/null 2>&1; then echo "yes=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.exists.outputs.yes != 'true'
        with:
          name: Shardfall-macOS
          path: dmg
      - name: Publish
        if: steps.exists.outputs.yes != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          cp dmg/*.dmg "Shardfall-${tag#v}.dmg"
          gh release create "$tag" "Shardfall-${tag#v}.dmg" \
            --target "$GITHUB_SHA" --title "Shardfall ${tag#v}" --notes-file docs/INSTALL.md
