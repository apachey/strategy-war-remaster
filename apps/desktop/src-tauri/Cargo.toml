[package]
name = "strategy-war-remaster"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "strategy_war_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
